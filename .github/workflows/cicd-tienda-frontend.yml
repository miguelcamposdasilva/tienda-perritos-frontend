name: CI/CD Tienda Perritos - Frontend (EKS)

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-deploy-eks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Login en Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build imagen Frontend y push a ECR
      run: |
        docker build -t tienda-frontend .
        docker tag tienda-frontend:latest ${{ secrets.ECR_REGISTRY }}/tienda-frontend:latest
        docker push ${{ secrets.ECR_REGISTRY }}/tienda-frontend:latest

    - name: Configurar kubectl (Conectar a EKS)
      run: |
        aws eks update-kubeconfig --region us-east-1 --name tienda-perritos-cluster-v2

    - name: Inyectar Secrets y Desplegar en EKS
      env:
        ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      run: |
        envsubst < k8s-frontend.yaml > k8s-frontend-final.yaml
        kubectl apply -f k8s-frontend-final.yaml